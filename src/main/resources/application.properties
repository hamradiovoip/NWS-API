spring.application.name=WeatherAPI
server.port=8081
stations=KFDK,KHGR,KMRB,KIAD,KDCA,KSBY,KCHO,K2G4,DEVC1,KLRU,KDMN,E3443,KDMA,PANC,KBCB,KCAR,KGUC,KEYW,PHTO,KFVE,KLRU
maxmap=12
alerts.url=https://api.weather.gov/alerts/active?area=
base.url=https://api.weather.gov
alerts.list=MD,PA,WV,VA,DE,NC,NJ,OH,NY,SC
spring.security.user.name=myuser
spring.security.user.password={noop}mypassword # {noop} is for plain text, use for example only

server.forward-headers-strategy=native

# Only treat requests from localhost/127.0.0.1 as trusted proxies
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto
server.tomcat.internal-proxies=127\\.0\\.0\\.1|::1


#spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# for security
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

#Ensure your application explicitly parses your views strictly as HTML 
#(rather than legacy formats) so that security rules are strictly applied
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=true


spring.web.error.whitelabel.enabled=false
# Force Spring Boot to throw an exception on 404 instead of forwarding to /error
#spring.mvc.throw-exception-if-no-handler-found=true
# Disable resource guessing so unmapped static resource requests also throw exceptions
spring.web.resources.add-mappings=false






