<!DOCTYPE html>
<html>

<head>
	<meta name="robots" content="noindex, nofollow" />
	<meta charset="utf-8">
	<!-- Sets the referrer policy to origin for the entire page -->
	<meta name="referrer" content="origin">
	<link rel="shortcut icon" type="image/x-icon" th:href="@{/images/favicon.ico}" />
	<title> [[${title}]] </title>
</head>
<th:block th:replace="~{fragments/sharedlayouts :: style-assets}"></th:block>

<div th:replace="~{fragments/navbar}"></div>

<body style="margin:30;padding:2">

	<h1 th:text="${weathermsg}"> </h1>


	<table style="width:95%" border="1" class="table table-striped table-responsive-md">
		<thead>
			<tr>
				<th>Event</th>
				<th> Headline</th>
				<th>What</th>
				<th>Location</th>
				<th>Description</th>

			</tr>
		</thead>
		<tbody>

			<tr th:each="a:${alert}">

				<td th:text="${a.event}"></td>
				<td th:text="${a.headline}"></td>
				<td th:text="${a.messageType}"></td>
				<td th:text="${a.areaDesc}"></td>
				<td th:text="${a.description}"></td>

			</tr>
		</tbody>
	</table>
	</div>
	<pre>


</pre>
	<th:block th:replace="~{fragments/footer}" />
</body>

</html>
