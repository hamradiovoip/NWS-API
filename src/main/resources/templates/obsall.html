<!DOCTYPE html>
<html>

<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow" />
	<!-- Sets the referrer policy to origin for the entire page -->
	<meta name="referrer" content="origin">
	<link rel="shortcut icon" type="image/x-icon" th:href="@{/images/favicon.ico}" />
	<title>Local Observations</title>


	<!-- Pulls in all CSS assets from the layout file  -->
	<th:block th:replace="~{fragments/layout-fragments :: leaflet-assets}"></th:block>
	<th:block th:replace="~{fragments/styles :: map-styles}"></th:block>

</head>

<body>
	<div th:replace="~{fragments/navbar}"></div>

	<title> Weather Observation Stations</title>
	<h1 th:text="${weathermsg}"> </h1>
	<h3 th:text="${name}"> </h3>
	<h3 th:text="${time}"> </h3>

	<pre>


    </pre>



	<table style="width:85%" sborder="1" class="table table-striped table-responsive-md">
		<thead>
			<tr>

				<th>Name</th>
				<th>Station Obs</th>
				<th>Station 24Hrs Obs (External)</th>
				<th>Temp</th>
				<th>Conditions</th>
			</tr>
		</thead>
		<tbody>

			<tr th:each="obs:${obsList}">

				<td th:text="${obs.name}"></td>
				<td><a th:href="@{/sta/(station=${obs.stationIdentifier})}" th:text="${obs.stationIdentifier}"></a> </td>

				<td><a th:href="@{https://www.weather.gov/wrh/timeseries(site=${obs.stationIdentifier})}" th:text="${obs.stationIdentifier}" target="_blank"></a> </td>

				<td th:text="${obs.temperature}"></td>
				<td th:text="${obs.textDescription}"></td>

			</tr>
		</tbody>
	</table>


	<div id="mapid" style="width: 800px; height: 500px;"></div>


	<script th:inline="javascript">

		var mylat = [[${lat}]];
		var mylon = [[${lon}]];

		var mymap = L.map('mapid').setView([mylat, mylon], 7);


		new L.tileLayer(
			'http://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
			maxZoom: 19
		}).addTo(mymap);

		var data = [[${pointList}]];


		// var list=$('#pointList').val();
		console.log("list: " + data.length);

		for (var i = 0; i < data.length; i++) {


			if (data[i].lat !== null && data[i].lon !== "") {
				// window.alert(data[i]);

				L.marker([data[i].lat, data[i].lon]).addTo(mymap)
					.bindPopup(
						"Station: " + data[i].stationName + '<br><b>'
						+ "name: " + data[i].stationIdentifier + '<br><b>'
						+ "temp: " + data[i].temperature + '<br><b>'
						+ "conditions : " + data[i].textDescription + '</b>'
					);
			}
		}

	</script>
	&nbsp; &nbsp;

	<img th:src="@{${radarUrl}}" alt="Radar">

	<th:block th:replace="~{fragments/footer}" />
</body>

</html>
