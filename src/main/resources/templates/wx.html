	<link rel="shortcut icon" type="image/x-icon" th:href="@{/images/favicon.ico}" />
	<th:block th:replace="~{fragments/layout-fragments :: leaflet-assets}"></th:block>

</pre>

				<th>% Precip.</th>


			</tr>
		</thead>
		<tbody>

			<tr th:each="period:${periods}">

				<td> <img th:src="@{${period.icon}}" alt="wx"> </td>

				<td th:text="${period.windSpeed}"></td>

				<td th:text="${period.probabilityOfPrecipitation.value}"></td>
			</tr>
		</tbody>
	</table>
